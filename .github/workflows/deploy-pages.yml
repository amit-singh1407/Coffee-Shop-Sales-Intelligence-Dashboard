name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Warn if API base URL is missing
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::VITE_API_BASE_URL is not set. The deployed site will fall back to localhost and API requests will fail."
          fi
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Ensure GitHub Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl -s -o /tmp/pages-site.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages")

          if [ "$status" = "404" ]; then
            echo "GitHub Pages site is missing. Creating it now."
            create_status=$(curl -s -o /tmp/create-pages-site.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow"}')

            if [ "$create_status" != "201" ] && [ "$create_status" != "409" ]; then
              echo "Failed to create the GitHub Pages site."
              cat /tmp/create-pages-site.json
              exit 1
            fi

            for attempt in 1 2 3 4 5; do
              ready_status=$(curl -s -o /tmp/pages-site.json -w "%{http_code}" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/pages")

              if [ "$ready_status" = "200" ]; then
                echo "GitHub Pages site is ready."
                break
              fi

              if [ "$attempt" = "5" ]; then
                echo "GitHub Pages site is still unavailable."
                cat /tmp/pages-site.json
                exit 1
              fi

              sleep 5
            done
          elif [ "$status" != "200" ]; then
            echo "Unexpected GitHub Pages response."
            cat /tmp/pages-site.json
            exit 1
          else
            echo "GitHub Pages site already exists."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4